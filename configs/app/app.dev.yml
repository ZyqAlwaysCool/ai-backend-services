# 开发环境配置
log:
  level: INFO
  dir: logs
  format: "{time} | {level} | {message}"
  retention: "7 days"
  compression: "zip"

mongo:
  host: 127.0.0.1
  port: 27017
  database: ai_backend_services_dev

redis:
  host: 127.0.0.1
  port: 6379
  db: 1  # 使用不同的redis数据库
  password: null
  max_connections: 10

# JWT认证配置
auth:
  jwt_secret_key: "ai-backend-services-jwt-secret-dev"
  token_expire_hours: 24

# 开发环境端口配置
server:
  host: "0.0.0.0"
  port: 20000

# Qdrant向量数据库配置
qdrant:
  host: "localhost"
  port: 6333
  timeout: 30
  embedding_dim: 1024  # 根据实际embedding模型调整

# Embedding模型配置
embedding:
  model_path: "models/Qwen3-Embedding-0___6B"  # 模型路径(相对于项目根目录)
  device: "cuda:2"  # 运行设备: cpu, cuda, cuda:0, cuda:1等
  batch_size: 4  # 批处理大小