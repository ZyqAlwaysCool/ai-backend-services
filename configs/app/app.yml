# 日志、存储、队列等公共开关
log:
  level: INFO
  dir: logs
  format: "{time} | {level} | {message}"
  retention: "30 days"
  compression: "zip"

mongo:
  host: 127.0.0.1
  port: 27017
  database: ai_backend_services

redis:
  host: 127.0.0.1
  port: 6379
  db: 0
  password: null
  max_connections: 10

# JWT认证配置
auth:
  jwt_secret_key: "ai-backend-services-jwt-secret"
  token_expire_hours: 24
