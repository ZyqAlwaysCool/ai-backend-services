# 日志、存储、队列等公共开关
log:
  level: INFO
  dir: logs
  format: "{time} | {level} | {message}"
  retention: "30 days"
  compression: "zip"

mongo:
  host: 127.0.0.1
  port: 27017
  database: ai_backend_services

# JWT认证配置
auth:
  jwt_secret_key: "your-super-secret-key-change-in-production-123456"
  token_expire_hours: 24
