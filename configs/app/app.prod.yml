# 生产环境配置
log:
  level: INFO
  dir: logs
  format: "{time} | {level} | {message}"
  retention: "30 days"
  compression: "zip"

mongo:
  host: 127.0.0.1
  port: 27017
  database: ai_backend_services

redis:
  host: 127.0.0.1
  port: 6379
  db: 0
  password: null
  max_connections: 20

# JWT认证配置
auth:
  jwt_secret_key: "ai-backend-services-jwt-secret-prod"
  token_expire_hours: 24

# 生产环境端口配置
server:
  host: "0.0.0.0"
  port: 19999

# Qdrant向量数据库配置
qdrant:
  host: "localhost"
  port: 6333
  timeout: 30
  embedding_dim: 768  # 根据实际embedding模型调整

# Embedding模型配置  
embedding:
  model_path: "models/Qwen3-Embedding-4B"  # 模型路径(相对于项目根目录)
  device: "cuda"  # 生产环境使用GPU: cpu, cuda, cuda:0, cuda:1等
  batch_size: 8  # 批处理大小