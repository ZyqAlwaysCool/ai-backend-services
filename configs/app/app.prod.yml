# 生产环境配置
log:
  level: INFO
  dir: logs
  format: "{time} | {level} | {message}"
  retention: "30 days"
  compression: "zip"

mongo:
  host: 127.0.0.1
  port: 27017
  database: ai_backend_services

redis:
  host: 127.0.0.1
  port: 6379
  db: 0
  password: null
  max_connections: 20

# JWT认证配置
auth:
  jwt_secret_key: "ai-backend-services-jwt-secret-prod"
  token_expire_hours: 24

# 生产环境端口配置
server:
  host: "0.0.0.0"
  port: 19999