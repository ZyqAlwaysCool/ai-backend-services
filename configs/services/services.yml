# AI服务配置 - 只管理业务逻辑配置
services:
  # 启用的服务模块
  enabled:
    - chat
    - document
    - retrieval
    # - multimodal  # 暂未启用

  # Chat服务配置 - 提供对话相关接口
  chat:
    enabled: true
    version: "1.0.0"
    # 启用的端点
    endpoints:
      chat: true      # 非流式对话
      chat_stream: true  # 流式对话
    # 引用的模型名称（具体配置在 llm_providers 中）
    enabled_models:
      - qwen3-32B
      - qwen3-14B
    # 业务限流配置
    rate_limits:
      chat_completion: 1000      # 每小时请求限制
      chat_completion_stream: 800  # 流式对话限制更严格

  # 文档处理服务配置
  document:
    enabled: true
    version: "1.0.0"
    endpoints:
      parse_document: true
      convert_format: true
      extract_content: true
    supported_formats:
      - pdf
      - docx
      - txt
      - markdown
    max_file_size: 52428800  # 50MB

  # 知识检索服务配置
  retrieval:
    enabled: true
    version: "1.0.0"
    endpoints:
      upload_files: true
      clean_document: true
      # 其他端点待后续添加
      # vector_search: true
      # hybrid_search: true
      # qa_retrieval: true
    # MongoDB配置
    retrieval_db_name: "ai_backend_services_retrieval"
    retrieval_document_collection_name: "retrieval_documents"
    retrieval_kb_collection_name: "retrieval_knowledge_bases"
    # 文件配置
    max_file_size: 52428800  # 50MB
    max_files_per_request: 10  # 单次请求最大文件数量
    supported_formats:
      - docx
    # 文档清洗性能配置
    clean_performance:
      sync_threshold: 20          # 同步处理阈值：≤20个文档同步处理，>20个异步处理
      chunk_batch_size: 10        # 异步处理时的分批大小
      single_doc_timeout_seconds: 30  # 单个文档清洗超时时间(秒)

  # 多模态服务配置（暂未启用）
  multimodal:
    enabled: false
    version: "1.0.0"
    endpoints:
      image_analysis: true
      image_to_text: true
      audio_processing: false