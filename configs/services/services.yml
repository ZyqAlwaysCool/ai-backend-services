# AI服务配置 - 只管理业务逻辑配置
services:
  # 启用的服务模块
  enabled:
    - chat
    - document
    - retrieval
    - mcp
    # - multimodal  # 暂未启用

  # Chat服务配置 - 提供对话相关接口
  chat:
    enabled: true
    version: "1.0.0"
    # 引用的模型名称（具体配置在 llm_providers 中）
    enabled_models:
      - qwen3-32B
      - qwen3-14B
    # 业务限流配置
    rate_limits:
      chat_completion: 1000      # 每小时请求限制
      chat_completion_stream: 800  # 流式对话限制更严格
    # mongodb配置
    chat_db_name: "ai_backend_services_chat"
    chat_apikey_collection_name: "chat_apikey" # 存储各chatflow平台的API Key
    chat_oauth_collection_name: "chat_oauth"   # 存储coze oauth配置
    # dify/coze等平台特殊配置
    coze_auth_mode: "api_key"  # api_key 或 oauth
    coze_oauth_token_ttl: 3600  # OAuth token有效期(秒)

  # 文档处理服务配置
  document:
    enabled: true
    version: "1.0.0"
    supported_formats:
      - pdf
      - docx
      - txt
      - markdown
    max_file_size: 52428800  # 50MB
    max_batch_files: 10  # 批处理最大文件数量

  # 知识检索服务配置
  retrieval:
    enabled: true
    version: "1.0.0"
    # MongoDB配置
    retrieval_db_name: "ai_backend_services_retrieval"
    retrieval_document_collection_name: "retrieval_documents"
    retrieval_kb_collection_name: "retrieval_knowledge_bases" # 知识库元数据管理
    # 文件配置
    max_file_size: 52428800  # 50MB
    max_files_per_request: 10  # 单次请求最大文件数量
    supported_formats:
      - docx
    # 文档清洗性能配置
    clean_performance:
      sync_threshold: 20          # 同步处理阈值：≤20个文档同步处理，>20个异步处理
      chunk_batch_size: 10        # 异步处理时的分批大小
      single_doc_timeout_seconds: 30  # 单个文档清洗超时时间(秒)
    kb_credential_collection_name: "kb_credentials"  # 知识库apikey凭证存储表名

  # 多模态服务配置（暂未启用）
  multimodal:
    enabled: false
    version: "1.0.0"
    endpoints:
      image_analysis: true
      image_to_text: true
      audio_processing: false

  # MCP服务配置
  mcp:
    enabled: true
    version: "1.0.0"
    mcp_db_name: "ai_backend_services_mcp"
    tool_collection_name: "mcp_tools"
    run_collection_name: "mcp_runs"
    run_step_collection_name: "mcp_run_steps"
    default_agent_mode: "supervisor"
    allowed_agent_modes:
      - "supervisor"
    max_tools_per_request: 5
    limits:
      max_steps: 6
      max_total_duration_ms: 60000
      per_tool_timeout_ms: 20000
      per_llm_timeout_ms: 15000
    cache:
      meta_ttl_seconds: 600
      client_ttl_seconds: 600
    server:
      host_env: "MCP_SERVER_HOST"
      port_env: "MCP_SERVER_PORT"
      default_host: "10.10.20.69"
      default_port: "28080"
      api_key_header: "X-API-Key"
    logging:
      enable_run_log: true
      enable_step_log: true
    streaming:
      emit_tool_events: true
      emit_plan_events: true
    llm:
      provider: "openai"
      model_name: "qwen3-32B"
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      api_key: ""
      temperature: 0.7
      timeout: 30
      max_tokens: 1024
    retry:
      max_attempts: 3
      backoff_ms: 500
